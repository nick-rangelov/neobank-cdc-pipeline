version: 2

sources:
  - name: raw_cdc
    description: Append-only raw tables loaded from S3 by load_raw.py
    schema: raw_cdc
    tables:
      - name: customers_snapshot
      - name: customer_events
        description: Change events. Freshness is checked with `dbt source freshness`.
        loaded_at_field: _loaded_at
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
      - name: load_log
