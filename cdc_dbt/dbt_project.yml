name: 'cdc_dbt'
version: '1.0.0'
profile: 'cdc_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Log position of the snapshot (data/snapshot/snapshot_manifest.json).
  # Events with seq <= snapshot_seq are already contained in the snapshot and are ignored.
  snapshot_seq: 541

models:
  cdc_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  cdc_dbt:
    expected_customers:
      +column_types:
        customer_id: integer
        first_name: varchar(100)
        last_name: varchar(100)
        email: varchar(255)
        country: varchar(100)
        segment: varchar(50)
        marketing_opt_in: varchar(10)
